<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deal Alert Preferences — HREI</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>window.__MEMBER_ROUTE__="member";</script><style>body{visibility:hidden}</style></head>
<body class="min-h-screen bg-slate-100 text-slate-900"><script src="/assets/js/auth-guard.js"></script>
<main class="mx-auto max-w-xl px-5 py-12"><a href="/members/" class="font-extrabold text-teal-800">← HREI Members</a><section class="mt-10 rounded-2xl bg-white p-7 shadow"><p class="text-sm font-bold uppercase tracking-wider text-teal-800">Investor settings</p><h1 class="mt-2 text-3xl font-extrabold">Deal alerts</h1><p class="mt-3 text-slate-600">Choose whether HREI may send you email alerts for available investor opportunities.</p><label class="mt-6 flex items-center gap-3 rounded-xl border p-4"><input id="enabled" type="checkbox" class="h-5 w-5"><span><b>Receive deal-alert emails</b><span class="block text-sm text-slate-500">You can change this at any time.</span></span></label><button id="save" class="mt-5 rounded-lg bg-teal-800 px-5 py-3 font-bold text-white">Save preference</button><p id="message" class="mt-4 text-sm"></p></section></main>
<script>window.addEventListener("hrei:member-ready",async e=>{document.body.style.visibility="visible";const c=e.detail.client,id=e.detail.user.id,{data}=await c.from("member_email_preferences").select("deal_alerts_enabled").eq("member_id",id).maybeSingle();const enabled=document.getElementById("enabled");enabled.checked=data?.deal_alerts_enabled!==false;document.getElementById("save").onclick=async()=>{const {error}=await c.from("member_email_preferences").upsert({member_id:id,deal_alerts_enabled:enabled.checked,updated_at:new Date().toISOString()});document.getElementById("message").textContent=error?error.message:"Your preference has been saved.";};});</script></body></html>
