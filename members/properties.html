<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Available Properties — HREI</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>window.__MEMBER_ROUTE__="member";</script><style>body{visibility:hidden}</style></head>
<body class="min-h-screen bg-slate-100 text-slate-900"><script src="/assets/js/auth-guard.js"></script>
<main class="mx-auto max-w-6xl px-5 py-10"><header class="flex items-center justify-between gap-4"><a href="/members/" class="font-extrabold text-teal-800">HREI Members</a><div class="flex gap-4"><a id="ownerLink" class="hidden text-sm font-semibold text-teal-800" href="/members/owner.html">Owner CRM</a><a id="jobsLink" class="text-sm font-semibold text-teal-800" href="/members/jobs.html">My Jobs</a><button id="out" class="text-sm font-semibold text-teal-800">Sign out</button></div></header>
<section class="mt-10"><p class="text-sm font-bold uppercase tracking-wider text-teal-800">Investor Portfolio</p><h1 class="mt-2 text-4xl font-extrabold">Available Properties</h1><p class="mt-3 text-slate-600">Current HREI opportunities. Contact the HREI office for details.</p><div id="properties" class="mt-8 grid gap-5 md:grid-cols-2 lg:grid-cols-3"><p class="text-slate-500">Loading properties…</p></div></section></main>
<script>
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const money=v=>v==null?"Price available on request":new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(v);
window.addEventListener("hrei:member-ready",async e=>{document.body.style.visibility="visible";const {client,profile,contractor}=e.detail;if(profile.role==="owner")document.getElementById("ownerLink").classList.remove("hidden");if(!contractor)document.getElementById("jobsLink").classList.add("hidden");const {data,error}=await client.from("properties").select("*").eq("status","available").order("created_at",{ascending:false});const root=document.getElementById("properties");if(error){root.textContent="Properties are not available yet.";return}if(!data.length){root.innerHTML='<p class="rounded-xl bg-white p-6 text-slate-600 shadow">There are no properties available right now. Please check back soon.</p>';return}root.innerHTML=data.map(p=>'<article class="overflow-hidden rounded-2xl bg-white shadow">'+(p.image_url?'<img class="h-48 w-full object-cover" src="'+esc(p.image_url)+'" alt="">':'<div class="flex h-48 items-center justify-center bg-teal-800 text-5xl">🏠</div>')+'<div class="p-6"><h2 class="text-xl font-extrabold">'+esc(p.title)+'</h2><p class="mt-2 text-sm text-slate-600">'+esc([p.address,p.city,p.state].filter(Boolean).join(", "))+'</p><p class="mt-4 font-bold text-teal-800">'+money(p.list_price)+'</p><p class="mt-3 text-sm text-slate-600">'+esc(p.description||"Contact HREI for details.")+'</p></div></article>').join("");});
document.getElementById("out").onclick=async()=>{await window.currentMember.client.auth.signOut();location.replace("/login.html")};
</script></body></html>
