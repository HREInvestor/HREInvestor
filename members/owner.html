<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner CRM — HREI</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>window.__MEMBER_ROUTE__="owner";</script><style>body{visibility:hidden}</style></head>
<body class="min-h-screen bg-slate-100 text-slate-900"><script src="/assets/js/auth-guard.js"></script>
<main class="mx-auto max-w-7xl px-5 py-10"><header class="flex flex-wrap items-center justify-between gap-4"><a href="/members/" class="font-extrabold text-teal-800">HREI Owner CRM</a><div class="flex gap-4"><a class="text-sm font-semibold text-teal-800" href="/members/properties.html">Investor view</a><a class="text-sm font-semibold text-teal-800" href="/members/jobs.html">Contractor view</a><a class="text-sm font-semibold text-teal-800" href="/members/outreach.html">Outreach</a><button id="out" class="text-sm font-semibold text-teal-800">Sign out</button></div></header>
<section class="mt-10"><p class="text-sm font-bold uppercase tracking-wider text-teal-800">Owner Workspace</p><h1 class="mt-2 text-4xl font-extrabold">CRM & Operations</h1><p class="mt-3 text-slate-600">Seller leads, available properties, contractor work, and members in one place.</p></section>
<section class="mt-8 grid gap-5 lg:grid-cols-3"><article class="rounded-2xl bg-white p-6 shadow lg:col-span-2"><div class="flex items-center justify-between"><h2 class="text-xl font-extrabold">Seller leads</h2><span id="leadCount" class="rounded-full bg-teal-50 px-3 py-1 text-sm font-bold text-teal-800">Loading…</span></div><div id="leads" class="mt-5 space-y-3"></div></article>
<article class="rounded-2xl bg-white p-6 shadow"><h2 class="text-xl font-extrabold">Add property</h2><form id="propertyForm" class="mt-5 space-y-3"><input name="title" required placeholder="Property title" class="w-full rounded-lg border p-3"><input name="address" placeholder="Street address" class="w-full rounded-lg border p-3"><div class="grid grid-cols-2 gap-3"><input name="city" placeholder="City" class="w-full rounded-lg border p-3"><input name="state" value="AL" maxlength="2" placeholder="State" class="w-full rounded-lg border p-3"></div><input name="list_price" type="number" min="0" placeholder="List price" class="w-full rounded-lg border p-3"><input name="image_url" type="url" placeholder="Photo URL (optional)" class="w-full rounded-lg border p-3"><textarea name="description" placeholder="Investor-facing details" class="w-full rounded-lg border p-3"></textarea><select name="status" class="w-full rounded-lg border p-3"><option value="draft">Draft</option><option value="available">Available to investors</option></select><button class="w-full rounded-lg bg-teal-800 px-4 py-3 font-bold text-white">Save property</button></form><p id="propertyMessage" class="mt-3 text-sm"></p></article></section>
<section class="mt-8 grid gap-5 lg:grid-cols-2"><article class="rounded-2xl bg-white p-6 shadow"><h2 class="text-xl font-extrabold">Available properties</h2><div id="properties" class="mt-5 space-y-3"></div></article><article class="rounded-2xl bg-white p-6 shadow"><h2 class="text-xl font-extrabold">Create contractor job</h2><form id="jobForm" class="mt-5 space-y-3"><input name="title" required placeholder="Job title" class="w-full rounded-lg border p-3"><textarea name="description" placeholder="Scope of work" class="w-full rounded-lg border p-3"></textarea><select id="jobContractor" name="assigned_to" class="w-full rounded-lg border p-3"><option value="">Assign later</option></select><select id="jobProperty" name="property_id" class="w-full rounded-lg border p-3"><option value="">No property selected</option></select><input name="due_date" type="date" class="w-full rounded-lg border p-3"><input name="budget" type="number" min="0" placeholder="Budget" class="w-full rounded-lg border p-3"><button class="w-full rounded-lg bg-teal-800 px-4 py-3 font-bold text-white">Create job</button></form><p id="jobMessage" class="mt-3 text-sm"></p><div id="jobs" class="mt-5 space-y-3"></div></article></section>
<section class="mt-8 rounded-2xl bg-white p-6 shadow"><h2 class="text-xl font-extrabold">Members</h2><div id="members" class="mt-5 grid gap-3 md:grid-cols-2"></div></section></main>
<script>
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const stages=["New Lead","Contacted","Offer Sent","Under Contract","Closed","Not a Fit"];
window.addEventListener("hrei:member-ready",async e=>{document.body.style.visibility="visible";const c=e.detail.client;const [leadR,propR,jobR,memberR]=await Promise.all([c.from("leads").select("*").order("created_at",{ascending:false}).limit(100),c.from("properties").select("*").order("created_at",{ascending:false}),c.from("contractor_jobs").select("*,properties(title),member_profiles(email)").order("created_at",{ascending:false}),c.from("member_profiles").select("id,email,role,subscription_status").order("email")]);const leads=leadR.data||[],props=propR.data||[],jobs=jobR.data||[],members=memberR.data||[];document.getElementById("leadCount").textContent=leads.length+" latest";document.getElementById("leads").innerHTML=leads.length?leads.map(l=>'<article class="rounded-xl border border-slate-200 p-4"><div class="flex flex-wrap justify-between gap-3"><div><b>'+esc(l.seller_name)+'</b><p class="text-sm text-slate-600">'+esc(l.phone)+" · "+esc(l.email||"No email")+'</p><p class="mt-1 text-sm">'+esc([l.property_address,l.city,l.state,l.zip].filter(Boolean).join(", "))+'</p>'+(l.phone?'<a href="tel:'+encodeURIComponent(l.phone)+'" class="mt-3 inline-block rounded-lg bg-teal-800 px-3 py-2 text-sm font-bold text-white" title="Uses your configured Google Voice one-click dialing">Call with Google Voice</a>':'')+'</div><select data-lead="'+l.id+'" class="rounded-lg border px-2 py-1 text-sm">'+stages.map(s=>'<option '+(l.stage===s?"selected":"")+">"+s+"</option>").join("")+'</select></div>'+(l.notes?'<p class="mt-2 text-sm text-slate-600">'+esc(l.notes)+"</p>":"")+'</article>').join(""):'<p class="text-slate-500">No leads yet.</p>';document.querySelectorAll("[data-lead]").forEach(x=>x.onchange=async()=>{const{error}=await c.from("leads").update({stage:x.value}).eq("id",x.dataset.lead);if(error)alert("Could not update lead stage.")});document.getElementById("properties").innerHTML=props.length?props.map(p=>'<div class="rounded-xl border p-4"><b>'+esc(p.title)+'</b><p class="mt-1 text-sm text-slate-600">'+esc(p.status)+" · "+(p.list_price?Number(p.list_price).toLocaleString("en-US",{style:"currency",currency:"USD"}):"No price")+'</p></div>').join(""):'<p class="text-slate-500">No properties yet.</p>';document.getElementById("jobs").innerHTML=jobs.length?jobs.map(j=>'<div class="rounded-xl border p-4"><b>'+esc(j.title)+'</b><p class="text-sm text-slate-600">'+esc(j.status)+" · "+esc(j.member_profiles?.email||"Unassigned")+'</p></div>').join(""):'<p class="text-slate-500">No jobs yet.</p>';document.getElementById("members").innerHTML=members.map(m=>'<div class="rounded-xl border p-4"><b>'+esc(m.email)+'</b><p class="mt-1 text-sm text-slate-600">'+esc(m.role)+" · "+esc(m.subscription_status)+'</p></div>').join("");document.getElementById("jobContractor").innerHTML+='<option disabled>── Contractors ──</option>'+members.filter(m=>m.role==="contractor"&&m.subscription_status==="active").map(m=>'<option value="'+m.id+'">'+esc(m.email)+'</option>').join("");document.getElementById("jobProperty").innerHTML+=props.map(p=>'<option value="'+p.id+'">'+esc(p.title)+'</option>').join("");document.getElementById("propertyForm").onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.target),row=Object.fromEntries(f);row.list_price=row.list_price?Number(row.list_price):null;row.created_by=e.detail.user.id;const{error}=await c.from("properties").insert(row);document.getElementById("propertyMessage").textContent=error?error.message:"Property saved. Refresh this page to see it in the list.";if(!error)ev.target.reset()};document.getElementById("jobForm").onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.target),row=Object.fromEntries(f);for(const k of["assigned_to","property_id","due_date"])if(!row[k])row[k]=null;row.budget=row.budget?Number(row.budget):null;const{error}=await c.from("contractor_jobs").insert(row);document.getElementById("jobMessage").textContent=error?error.message:"Job created. Refresh this page to see it in the list.";if(!error)ev.target.reset()};});
document.getElementById("out").onclick=async()=>{await window.currentMember.client.auth.signOut();location.replace("/login.html")};
</script></body></html>
