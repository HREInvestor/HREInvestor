<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lead Search & Pipeline — HREI</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>window.__MEMBER_ROUTE__="owner";</script><style>body{visibility:hidden}</style></head>
<body class="min-h-screen bg-slate-100 text-slate-900"><script src="/assets/js/auth-guard.js"></script>
<main class="mx-auto max-w-7xl px-5 py-10"><header class="flex flex-wrap items-center justify-between gap-4"><a href="/members/owner.html" class="font-extrabold text-teal-800">← Owner CRM</a><button id="out" class="text-sm font-semibold text-teal-800">Sign out</button></header>
<section class="mt-10"><p class="text-sm font-bold uppercase tracking-wider text-teal-800">Owner CRM</p><h1 class="mt-2 text-4xl font-extrabold">Lead Search & Pipeline</h1><p class="mt-3 text-slate-600">Find sellers quickly and update the next action without leaving the list.</p></section>
<section class="mt-8 rounded-2xl bg-white p-5 shadow"><div class="grid gap-3 md:grid-cols-4"><input id="search" type="search" placeholder="Search name, address, phone, or email" class="rounded-lg border p-3 md:col-span-2"><select id="stageFilter" class="rounded-lg border p-3"><option value="">All stages</option><option>New Lead</option><option>Contacted</option><option>Offer Sent</option><option>Under Contract</option><option>Closed</option><option>Not a Fit</option></select><select id="priorityFilter" class="rounded-lg border p-3"><option value="">All priorities</option><option value="hot">Hot</option><option value="warm">Warm</option><option value="cold">Cold</option></select><select id="followUpFilter" class="rounded-lg border p-3"><option value="">All follow-up dates</option><option value="overdue">Overdue</option><option value="today">Due today</option><option value="upcoming">Upcoming</option><option value="none">No follow-up set</option></select><button id="clear" class="rounded-lg border border-teal-800 px-3 py-2 font-bold text-teal-800">Clear filters</button></div><p id="resultCount" class="mt-4 text-sm font-semibold text-slate-600">Loading leads…</p></section>
<section class="mt-6 grid gap-4 md:grid-cols-3"><article class="rounded-2xl bg-white p-5 shadow"><p class="text-sm font-bold text-red-700">Hot leads</p><p id="hotCount" class="mt-1 text-3xl font-extrabold">—</p></article><article class="rounded-2xl bg-white p-5 shadow"><p class="text-sm font-bold text-amber-700">Due / overdue</p><p id="dueCount" class="mt-1 text-3xl font-extrabold">—</p></article><article class="rounded-2xl bg-white p-5 shadow"><p class="text-sm font-bold text-teal-800">Active pipeline</p><p id="activeCount" class="mt-1 text-3xl font-extrabold">—</p></article></section>
<section class="mt-6 rounded-2xl bg-white p-6 shadow"><div id="leads" class="space-y-4"></div></section>
</main><script src="/assets/js/lead-pipeline.js"></script></body></html>
