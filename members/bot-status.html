<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Bot Status — HREI Owner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>window.__MEMBER_ROUTE__="owner";</script>
  <style>
    body{visibility:hidden}
    .pos{color:#047857}
    .neg{color:#b91c1c}
    .chip{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:.2rem .55rem}
    .chip-real{background:#ecfdf5;color:#047857}
    .chip-paper{background:#f1f5f9;color:#475569}
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
<script src="/assets/js/auth-guard.js"></script>
<main class="mx-auto max-w-3xl px-4 py-6 pb-16">
  <header class="flex items-center justify-between gap-3">
    <div>
      <p class="text-xs font-bold uppercase tracking-wider text-teal-800">Owner only</p>
      <h1 class="text-2xl font-extrabold">Bot status</h1>
    </div>
    <div class="text-right">
      <div id="fresh" class="text-xs font-semibold text-slate-500">Waiting…</div>
      <button id="out" class="mt-1 text-sm font-semibold text-teal-800">Sign out</button>
    </div>
  </header>

  <section id="alert" class="mt-4 hidden rounded-xl border border-amber-300 bg-amber-50 px-4 py-3 text-sm font-semibold text-amber-900"></section>

  <section class="mt-5 grid grid-cols-2 gap-3">
    <article class="rounded-2xl bg-white p-4 shadow-sm">
      <p class="text-xs font-bold uppercase tracking-wider text-slate-500">Polymarket</p>
      <p id="pmBal" class="mt-1 text-2xl font-extrabold tabular-nums">—</p>
      <p id="pmAuth" class="mt-1 text-xs font-semibold text-slate-500">auth</p>
    </article>
    <article class="rounded-2xl bg-white p-4 shadow-sm">
      <p class="text-xs font-bold uppercase tracking-wider text-slate-500">Kalshi</p>
      <p id="kxBal" class="mt-1 text-2xl font-extrabold tabular-nums">—</p>
      <p id="kxAuth" class="mt-1 text-xs font-semibold text-slate-500">auth</p>
    </article>
  </section>

  <section class="mt-3 grid grid-cols-3 gap-3">
    <article class="rounded-2xl bg-white p-3 shadow-sm text-center">
      <p class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Open</p>
      <p id="openAll" class="mt-1 text-xl font-extrabold tabular-nums">—</p>
    </article>
    <article class="rounded-2xl bg-white p-3 shadow-sm text-center">
      <p class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Today P/L</p>
      <p id="todayAll" class="mt-1 text-xl font-extrabold tabular-nums">—</p>
    </article>
    <article class="rounded-2xl bg-white p-3 shadow-sm text-center">
      <p class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Total P/L</p>
      <p id="totalAll" class="mt-1 text-xl font-extrabold tabular-nums">—</p>
    </article>
  </section>

  <section class="mt-6">
    <h2 class="text-lg font-extrabold">Polymarket</h2>
    <div id="pmList" class="mt-3 space-y-2"></div>
  </section>
  <section class="mt-6">
    <h2 class="text-lg font-extrabold">Kalshi</h2>
    <div id="kxList" class="mt-3 space-y-2"></div>
  </section>
</main>
<script src="/assets/js/bot-status.js"></script>
</body>
</html>
