<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contracts — HREI</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>window.__MEMBER_ROUTE__="owner";</script><style>body{visibility:hidden}</style></head><body class="min-h-screen bg-slate-100 text-slate-900"><script src="/assets/js/auth-guard.js"></script><main class="mx-auto max-w-6xl px-5 py-10"><header class="flex justify-between"><a href="/members/owner.html" class="font-extrabold text-teal-800">← Owner CRM</a><button id="out" class="text-sm font-semibold text-teal-800">Sign out</button></header><section class="mt-10 grid gap-5 lg:grid-cols-2"><article class="rounded-2xl bg-white p-6 shadow"><p class="text-sm font-bold uppercase tracking-wider text-teal-800">Owner e-sign</p><h1 class="mt-2 text-3xl font-extrabold">Send a contract</h1><p class="mt-2 text-sm text-slate-600">Start in test mode. Test documents do not send a real signature request.</p><form id="form" class="mt-5 space-y-3"><input name="title" required placeholder="Contract title" class="w-full rounded-lg border p-3"><input name="template_id" required placeholder="SignWell template ID" class="w-full rounded-lg border p-3"><input name="placeholder_name" required value="Signer" placeholder="Template signer placeholder" class="w-full rounded-lg border p-3"><input name="signer_name" required placeholder="Signer full name" class="w-full rounded-lg border p-3"><input name="signer_email" required type="email" placeholder="Signer email" class="w-full rounded-lg border p-3"><label class="flex items-center gap-2 text-sm font-bold"><input name="test_mode" type="checkbox" checked> Test mode — no real signing request</label><button id="send" class="w-full rounded-lg bg-teal-800 px-4 py-3 font-bold text-white">Send for signature</button></form><p id="message" class="mt-3 text-sm"></p></article><article class="rounded-2xl bg-white p-6 shadow"><h2 class="text-xl font-extrabold">Contract history</h2><div id="history" class="mt-5 space-y-3"><p class="text-slate-500">Loading…</p></div></article></section></main><script>const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));window.addEventListener("hrei:member-ready",async e=>{document.body.style.visibility="visible";const c=e.detail.client,history=document.getElementById("history");const load=async()=>{const{data,error}=await c.from("esign_contracts").select("*").order("created_at",{ascending:false});if(error){history.innerHTML='<p class="text-amber-700">Run the e-sign contracts migration in Supabase, then refresh.</p>';return}history.innerHTML=data.length?data.map(x=>'<article class="rounded-xl border p-4"><b>'+esc(x.title)+'</b><p class="mt-1 text-sm text-slate-600">'+esc(x.signer_name)+' · '+esc(x.signer_email)+'</p><p class="mt-2 text-sm font-bold text-teal-800">'+esc(x.status)+(x.test_mode?' · Test mode':'')+'</p></article>').join(''):'<p class="text-slate-500">No contracts sent yet.</p>'};await load();document.getElementById("form").onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.target),body=Object.fromEntries(f);body.test_mode=f.get("test_mode")==="on";const btn=document.getElementById("send");btn.disabled=true;const {data:{session}}=await c.auth.getSession();if(!session){document.getElementById("message").textContent="Your sign-in session expired. Please sign in again.";btn.disabled=false;return}const{data,error}=await c.functions.invoke("signwell-send",{body,headers:{Authorization:"Bearer "+session.access_token}});let sendMessage=data?.error||"Contract created.";if(error){sendMessage=error.message||"Could not send the contract.";try{const detail=await error.context?.clone().json();sendMessage=detail?.error||detail?.message||sendMessage}catch(_){}}document.getElementById("message").textContent=sendMessage;btn.disabled=false;if(!error&&!data?.error){ev.target.reset();await load()}}});document.getElementById("out").onclick=async()=>{await window.currentMember.client.auth.signOut();location.replace("/login.html")};</script></body></html>
