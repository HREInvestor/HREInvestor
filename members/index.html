<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Members — HREI</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>window.__MEMBER_ROUTE__="member";</script><style>body{visibility:hidden}</style></head><body class="min-h-screen bg-slate-100 text-slate-900"><script src="/assets/js/auth-guard.js"></script><main class="mx-auto max-w-5xl px-5 py-12"><header class="flex justify-between"><a href="/" class="font-extrabold text-teal-800">HREI Members</a><button id="out" class="text-sm font-semibold text-teal-800">Sign out</button></header><p id="role" class="mt-12 text-sm font-bold uppercase tracking-wider text-teal-800">Loading…</p><h1 id="welcome" class="mt-2 text-4xl font-extrabold">Welcome</h1><p id="summary" class="mt-3 text-slate-600"></p><div id="cards" class="mt-8 grid gap-5 md:grid-cols-3"></div></main><script>const card=(href,title,text)=>'<a href="'+href+'" class="rounded-2xl bg-white p-6 shadow transition hover:-translate-y-1"><b>'+title+'</b><p class="mt-2 text-sm text-slate-600">'+text+'</p></a>';window.addEventListener("hrei:member-ready",e=>{const m=e.detail,p=m.profile;document.body.style.visibility="visible";document.getElementById("role").textContent=p.role+" account";document.getElementById("welcome").textContent="Welcome, "+m.user.email;let cards=[card("/members/properties.html","🏠 Available Properties","View current HREI opportunities.")];if(p.role==="owner"){document.getElementById("summary").textContent="You have full HREI CRM and operations access.";cards.unshift(card("/members/owner.html","📊 Owner CRM","Manage seller leads, properties, jobs, and member approvals."));cards.push(card("/members/jobs.html","🔧 Contractor Jobs","View all contractor work."));cards.push(card("/members/markets.html","📍 ZIP Markets","Score Alabama ZIP codes and focus your buying efforts."));}else if(m.contractor){document.getElementById("summary").textContent="Your Contractor access has been approved.";cards.unshift(card("/members/jobs.html","🔧 My Jobs","View and update assigned jobs."));}else{document.getElementById("summary").textContent="Your Investor access has been approved."; }document.getElementById("cards").innerHTML=cards.join("");});document.getElementById("out").onclick=async()=>{await window.currentMember.client.auth.signOut();location.replace("/login.html")};</script></body></html>
