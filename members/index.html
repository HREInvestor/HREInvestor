<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Members — HREI</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>window.__MEMBER_ROUTE__="member";</script><style>body{visibility:hidden}</style></head><body class="min-h-screen bg-slate-100 text-slate-900"><script src="/assets/js/auth-guard.js"></script><main class="mx-auto max-w-5xl px-5 py-12"><div class="flex justify-between"><a href="/" class="font-extrabold text-teal-800">HREI Members</a><button id="out" class="text-sm font-semibold text-teal-800">Sign out</button></div><p id="role" class="mt-12 text-sm font-bold uppercase tracking-wider text-teal-800">Loading…</p><h1 id="welcome" class="mt-2 text-4xl font-extrabold">Welcome</h1><p id="summary" class="mt-3 text-slate-600"></p><div class="mt-8 grid gap-5 md:grid-cols-3"><a href="/schedule.html" class="rounded-2xl bg-white p-6 shadow"><b>📅 Schedule a meeting</b><p class="mt-2 text-sm text-slate-600">Book time with HREI.</p></a><a href="/sell-fast.html" class="rounded-2xl bg-white p-6 shadow"><b>🏠 Submit a property</b><p class="mt-2 text-sm text-slate-600">Request a cash-offer review.</p></a><a href="/payment.html" class="rounded-2xl bg-white p-6 shadow"><b id="memberTitle">💳 Contractor membership</b><p id="memberText" class="mt-2 text-sm text-slate-600">$25/month for Contractor access.</p></a></div><section id="owner" class="mt-8 hidden rounded-xl bg-amber-50 p-5 text-sm text-amber-950"><b>Owner access is active.</b> The CRM stays separate from this public website.</section></main><script>window.addEventListener("hrei:member-ready",e=>{const m=e.detail,p=m.profile;document.body.style.visibility="visible";document.getElementById("role").textContent=p.role+" account";document.getElementById("welcome").textContent="Welcome, "+m.user.email;document.getElementById("summary").textContent=m.contractor?"Your Contractor membership is active.":"Your free Investor account is active.";if(p.role==="owner"){document.getElementById("owner").classList.remove("hidden");document.getElementById("summary").textContent="You have full HREI member access."}if(m.contractor){document.getElementById("memberTitle").textContent="💳 Contractor membership active";document.getElementById("memberText").textContent="View your membership status."}});document.getElementById("out").onclick=async()=>{await window.currentMember.client.auth.signOut();location.replace("/login.html")}</script></body></html>
