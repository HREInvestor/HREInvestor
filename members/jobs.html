<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contractor Jobs — HREI</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>window.__MEMBER_ROUTE__="contractor";</script><style>body{visibility:hidden}</style></head>
<body class="min-h-screen bg-slate-100 text-slate-900"><script src="/assets/js/auth-guard.js"></script>
<main class="mx-auto max-w-5xl px-5 py-10"><header class="flex items-center justify-between gap-4"><a href="/members/" class="font-extrabold text-teal-800">HREI Members</a><div class="flex gap-4"><a id="ownerLink" class="hidden text-sm font-semibold text-teal-800" href="/members/owner.html">Owner CRM</a><a class="text-sm font-semibold text-teal-800" href="/members/properties.html">Properties</a><button id="out" class="text-sm font-semibold text-teal-800">Sign out</button></div></header>
<section class="mt-10"><p class="text-sm font-bold uppercase tracking-wider text-teal-800">Contractor Workspace</p><h1 class="mt-2 text-4xl font-extrabold">My Jobs</h1><p class="mt-3 text-slate-600">Keep job status current so the HREI team can track progress.</p><div id="jobs" class="mt-8 space-y-4"><p class="text-slate-500">Loading jobs…</p></div></section></main>
<script>
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const label=v=>String(v||"open").replaceAll("_"," ");
window.addEventListener("hrei:member-ready",async e=>{document.body.style.visibility="visible";const {client,profile}=e.detail;if(profile.role==="owner")document.getElementById("ownerLink").classList.remove("hidden");const {data,error}=await client.from("contractor_jobs").select("*, properties(title,address,city,state)").order("due_date",{ascending:true});const root=document.getElementById("jobs");if(error){root.textContent="Jobs are not available yet.";return}if(!data.length){root.innerHTML='<p class="rounded-xl bg-white p-6 text-slate-600 shadow">No jobs are assigned to you yet.</p>';return}root.innerHTML=data.map(j=>'<article class="rounded-2xl bg-white p-6 shadow"><div class="flex flex-wrap items-start justify-between gap-3"><div><h2 class="text-xl font-extrabold">'+esc(j.title)+'</h2><p class="mt-1 text-sm text-slate-600">'+esc(j.properties?.title||j.properties?.address||"HREI job")+'</p></div><select data-id="'+j.id+'" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-semibold">'+["assigned","in_progress","blocked","complete"].map(s=>'<option value="'+s+'" '+(j.status===s?"selected":"")+">"+label(s)+"</option>").join("")+'</select></div><p class="mt-4 text-slate-700">'+esc(j.description||"No additional details.")+'</p><p class="mt-4 text-sm text-slate-500">'+(j.due_date?"Due "+esc(j.due_date):"No due date")+(j.budget?" · Budget "+Number(j.budget).toLocaleString("en-US",{style:"currency",currency:"USD"}):"")+'</p></article>').join("");root.querySelectorAll("select[data-id]").forEach(s=>s.onchange=async()=>{s.disabled=true;const {error}=await client.from("contractor_jobs").update({status:s.value}).eq("id",s.dataset.id);if(error)alert("Could not update this job. Please try again.");s.disabled=false});});
document.getElementById("out").onclick=async()=>{await window.currentMember.client.auth.signOut();location.replace("/login.html")};
</script></body></html>
