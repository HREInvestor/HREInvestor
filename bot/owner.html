<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif;margin:0;background:linear-gradient(135deg,#073C40 0%,#0B5C63 60%,#0e7a84 100%);min-height:100vh;color:#1e293b}.card{background:rgba(255,255,255,.97);max-width:1100px;margin:40px auto;padding:32px;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}h1{margin-top:0;font-weight:800}.btn{background:#0B5C63;color:#fff;border:0;padding:14px 24px;border-radius:12px;font-weight:700;font-size:1.05rem;cursor:pointer;text-decoration:none;display:inline-block}.btn:hover{background:#073C40}.btn[aria-disabled=true]{background:#94a3b8;pointer-events:none;cursor:not-allowed}.muted{color:#64748b;font-size:.9rem}code{word-break:break-all;background:#f1f5f9;padding:2px 6px;border-radius:6px}input[type=email],input[type=password]{width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;font-size:1rem;margin:6px 0 14px;box-sizing:border-box}table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{padding:8px;border-bottom:1px solid #e2e8f0;text-align:right}th:first-child,td:first-child{text-align:left}.err{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:12px;border-radius:10px}.dup{background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:999px;font-size:.8rem}.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}.tot div{background:#f8fafc;border-radius:12px;padding:12px}.tot b{display:block;font-size:1.2rem}</style><title>Prediction Bot Owner</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./bot-guard.js"></script></head><body><div class="card">
<div id="login" style="display:none;max-width:400px"><h1>Owner sign in</h1>
<form id="f"><label>Email</label><input type="email" id="em" required><label>Password</label><input type="password" id="pw" required>
<button class="btn" type="submit">Sign in</button></form><p id="lerr" class="err" style="display:none"></p></div>
<div id="na" style="display:none"><h1>Not authorized</h1><p>This page is for the HREI owner only.</p><button class="btn" id="so2">Sign out</button></div>
<div id="dash" style="display:none"><h1>Prediction Bot accounts</h1>
<p class="muted">Updated <span id="gen"></span> &middot; refreshes every 60 seconds &middot; <a href="#" id="so">Sign out</a></p>
<div class="tot" id="tot"></div>
<table><thead><tr><th>Name</th><th>Polymarket</th><th>Kalshi</th><th>Put in</th><th>P&amp;L today</th><th>P&amp;L all-time</th><th>W / L</th><th>Open</th><th>Last report</th></tr></thead><tbody id="rows"></tbody></table>
</div></div><script>
const $=id=>document.getElementById(id), show=id=>['login','na','dash'].forEach(x=>$(x).style.display=x===id?'block':'none');
const m=v=>(Number(v)||0).toLocaleString('en-US',{style:'currency',currency:'USD'}), esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const t=v=>v?new Date(v).toLocaleString('en-US',{timeZone:'America/Chicago',dateStyle:'short',timeStyle:'short'})+' CT':'—';
let timer;
async function load(){
  const s=await BB.session(); if(!s){show('login');return;}
  const {data,error}=await BB.summary();
  if(error){show('na');return;}
  const T=data.totals;
  $('gen').textContent=t(data.generated_at);
  $('tot').innerHTML=[['Accounts',T.accounts],['Polymarket',m(T.pm_balance)],['Kalshi',m(T.k_balance)],['Put in',m(T.amount_put_in)],['P&L today',m(T.pnl_today)],['P&L all-time',m(T.pnl_all_time)],['Wins / losses',T.wins+' / '+T.losses],['Open bets',T.open_bets],['Duplicate names',T.duplicates]].map(([k,v])=>'<div>'+esc(k)+'<b>'+esc(v)+'</b></div>').join('');
  $('rows').innerHTML=data.rows.length?data.rows.map(r=>'<tr><td>'+esc(r.display_name)+(r.duplicate?' <span class="dup">duplicate name ('+r.installs+' installs)</span>':'')+'</td><td>'+m(r.pm_balance)+'</td><td>'+m(r.k_balance)+'</td><td>'+m(r.amount_put_in)+'</td><td>'+m(r.pnl_today)+'</td><td>'+m(r.pnl_all_time)+'</td><td>'+r.wins+' / '+r.losses+'</td><td>'+r.open_bets+'</td><td>'+t(r.last_report_at)+'</td></tr>').join(''):'<tr><td colspan="9">No reports yet.</td></tr>';
  show('dash'); clearTimeout(timer); timer=setTimeout(load,60000);
}
$('f').addEventListener('submit',async e=>{e.preventDefault();$('lerr').style.display='none';
  const {error}=await BB.signIn($('em').value.trim(),$('pw').value);
  if(error){$('lerr').textContent=error.message;$('lerr').style.display='block';return;} load();});
const out=async e=>{e.preventDefault();clearTimeout(timer);await BB.signOut();show('login');};
$('so').addEventListener('click',out);$('so2').addEventListener('click',out);
load();
</script></body></html>
