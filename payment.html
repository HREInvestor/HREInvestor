<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contractor Membership — HREI</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>window.__MEMBER_ROUTE__="member";</script><style>body{visibility:hidden}</style></head><body class="min-h-screen bg-slate-100"><script src="/assets/js/auth-guard.js"></script><main class="mx-auto flex min-h-screen max-w-lg items-center px-5"><section class="w-full rounded-2xl bg-white p-8 shadow-xl"><a href="/members/" class="text-sm font-semibold text-teal-800">← Members</a><h1 class="mt-6 text-3xl font-extrabold">Contractor membership</h1><p class="mt-2 text-slate-600">$25/month. Owner and Investor accounts remain free.</p><p id="status" class="mt-6 rounded-lg bg-slate-50 p-4 text-sm">Checking account…</p><a id="checkout" href="REPLACE_WITH_SQUARE_PAYMENT_LINK" class="mt-6 block rounded-lg bg-teal-800 px-4 py-3 text-center font-bold text-white">Start Contractor membership</a><p class="mt-4 text-xs text-slate-500">Use the same email at Square and HREI. Access activates after Square confirms your subscription.</p></section></main><script>window.addEventListener("hrei:member-ready",e=>{const p=e.detail.profile,s=document.getElementById("status"),c=document.getElementById("checkout");document.body.style.visibility="visible";if(p.role==="owner"){s.textContent="Your Owner account has full access and needs no payment.";c.hidden=true}else if(e.detail.contractor){s.textContent="Your Contractor membership is active.";c.hidden=true}else{s.textContent="You are signed in as an Investor. Upgrade when ready.";if(c.href.includes("REPLACE_WITH_SQUARE_PAYMENT_LINK")){c.classList.add("pointer-events-none","opacity-50");c.textContent="Square checkout is being configured"}}})</script></body></html>
