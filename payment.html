<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account Access — HREI</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>window.__MEMBER_ROUTE__="member";</script><style>body{visibility:hidden}</style></head><body class="min-h-screen bg-slate-100"><script src="/assets/js/auth-guard.js"></script><main class="mx-auto flex min-h-screen max-w-lg items-center px-5"><section class="w-full rounded-2xl bg-white p-8 shadow-xl"><a href="/members/" class="text-sm font-semibold text-teal-800">← Members</a><h1 class="mt-6 text-3xl font-extrabold">Account access</h1><p class="mt-3 text-slate-600">HREI access is currently free and managed directly by the Owner. There is no payment or subscription required.</p><p id="status" class="mt-6 rounded-lg bg-teal-50 p-4 text-sm text-teal-900">Checking account…</p></section></main><script>window.addEventListener("hrei:member-ready",e=>{document.body.style.visibility="visible";const p=e.detail.profile;document.getElementById("status").textContent="Your approved role: "+p.role+". Contact HREI if you need a different access level."})</script></body></html>
